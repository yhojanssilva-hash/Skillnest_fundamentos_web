<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MiauLove - Comunidad de Gatitos</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <!-- Contenedor principal para dividir en 2 columnas con Flexbox -->
    <div class="contenedor-app">

        <!-- ===================================================
             SIDEBAR LATERAL IZQUIERDA
             =================================================== -->
        <aside class="sidebar">
            <div class="logo">
                <h2>miau<span>love</span></h2>
                <p class="icono-logo">🐾</p>
            </div>

            <nav class="menu-lateral">
                <a href="#" class="item-menu">Inicio</a>
                <a href="#" class="item-menu">Subir Imagen</a>
                <a href="#" class="item-menu">Contacto</a>
                <a href="#" class="item-menu">Favoritos</a>
                <a href="#" class="item-menu">Recientes</a>
            </nav>

            <div class="acciones-sidebar">
                <button class="btn-config">Configuración</button>
                <!-- REQUERIMIENTO 3: Botón con ID único para la alerta -->
                <button id="btn-cerrar-sesion" class="btn-cerrar">Cerrar Sesión</button>
            </div>

            <footer class="copy">
                <p>Todos los derechos reservados miaulove ©</p>
            </footer>
        </aside>

        <!-- ===================================================
             CONTENIDO PRINCIPAL DERECHO
             =================================================== -->
        <main class="contenido-principal">

            <header class="header-superior">
                <span class="icon-menu">☰</span>
                <input type="text" placeholder="Buscar" class="input-buscar">
            </header>

            <section class="hero">
                <h1>¡Únete y comparte tu amor por los gatitos!</h1>

                <!-- REQUERIMIENTO 1: Botones de categorías -->
                <div class="categorias">
                    <button class="btn-categoria">Gatitos</button>
                    <button class="btn-categoria">Juveniles</button>
                    <button class="btn-categoria">Adultos</button>
                </div>
            </section>

            <!-- REQUERIMIENTO 2: Tarjetas de productos con Likes -->
            <section class="galeria-grid">

                <div class="tarjeta-gato">
                    <div class="box-foto">[ Foto Gatito 1 ]</div>
                    <button class="btn-like">
                        💜 <span class="cant-likes">1</span>
                    </button>
                </div>

                <div class="tarjeta-gato">
                    <div class="box-foto">[ Foto Gatito 2 ]</div>
                    <button class="btn-like">
                        💜 <span class="cant-likes">2</span>
                    </button>
                </div>

                <div class="tarjeta-gato">
                    <div class="box-foto">[ Foto Gatito 3 ]</div>
                    <button class="btn-like">
                        💜 <span class="cant-likes">4</span>
                    </button>
                </div>

                <div class="tarjeta-gato">
                    <div class="box-foto">[ Foto Gatito 4 ]</div>
                    <button class="btn-like">
                        💜 <span class="cant-likes">6</span>
                    </button>
                </div>

            </section>

        </main>

    </div>

    <script src="static/js/script.js"></script>
</body>
</html>

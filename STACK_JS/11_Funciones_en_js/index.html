<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Funciones</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div class="contenedor">
        <h1>Funciones JS</h1>
        <div class="card">
            <h2>Ejemplo  1</h2>
            <p>Funciones sin parametros: Saludar</p>
            <button onclick="saludar()">Ejecutar</button>
        </div>
    </div>
    <div class="contenedor">
        <div class="card">
            <h2>Ejemplo  2</h2>
            <p>Funciones con parametros</p>
            <button onclick="saludarParam('Yhojáns')">Ejecutar</button>
        </div>
        <div class="contenedor">
        <div class="card">
            <h2>Ejemplo  3</h2>
            <p>Funciones con parametros return</p>
            <button onclick="mostrarResultado(numero1, numero2)">Ejecutar</button>
        </div>

    <script src="static/js/script.js"></script>
</body>
</html>
